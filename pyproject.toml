[project]
name = "portfolio-var"
version = "0.1.0"
description = "Research code for Portfolio-VaR"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "arch>=6.3",
    "yfinance>=0.2.36",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "pytest>=7.4"
]

[dependency-groups]
dev = ["pytest>=7.4", "nbconvert>=7.0", "ipykernel>=6.29"]

[tool.uv]
package = false
